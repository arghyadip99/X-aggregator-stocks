# ============================================================
# Categories — fully dynamic, add/remove freely
# Each becomes a separate email digest + frontend tab.
# ============================================================

categories:

  - id: analysis
    label: "📊 Analysis"
    color: "#0f3460"
    enabled: true
    prompt_focus: |
      Stock picks, conviction calls, buy/sell price levels, technical chart setups,
      fundamental deep-dives, valuation commentary, and entry/exit calls.

  - id: company_updates
    label: "🏢 Company Updates"
    color: "#1a6b3c"
    enabled: true
    prompt_focus: |
      Corporate actions, order wins, capex announcements, capacity expansions,
      management interviews, promoter activity, and business model changes.

  - id: quarterly_updates
    label: "📋 Quarterly Updates"
    color: "#7b4a00"
    enabled: true
    prompt_focus: |
      Quarterly results (revenue, PAT, EBITDA margins), YoY/QoQ comparisons,
      concall highlights, management guidance, and earnings surprises.

  - id: macro
    label: "🌐 Macro"
    color: "#4a1a7b"
    enabled: true
    prompt_focus: |
      FII/DII flows, RBI policy decisions, Union Budget commentary, global triggers
      (US Fed, crude oil, currency), sector rotation, and broad Nifty/Sensex views.

  # Template — copy-paste to add a new category:
  # - id: ipo_watch
  #   label: "🚀 IPO Watch"
  #   color: "#b5451b"
  #   enabled: false
  #   prompt_focus: |
  #     Upcoming IPOs, GMP trends, subscription data, allotment status,
  #     listing day expectations, and post-listing performance.

# ============================================================
# Settings
# ============================================================

settings:
  # How many hours back to look for posts
  fetch_hours: 24

  # Nitter RSS instances — tried in order, first success wins
  nitter_instances:
    - https://nitter.net

  # Groq model for both categorisation and digest generation
  groq_model: "llama-3.3-70b-versatile"

  # Minimum post length to include (filters noise/very short posts)
  min_post_length: 30

  # Delay between fetching each handle (seconds) — be polite to Nitter
  fetch_delay_seconds: 1

  # Groq retry settings (if API call fails)
  groq_retries: 2
  groq_retry_delay_seconds: 10

  # Store digests and posts to Supabase (requires SUPABASE_URL + SUPABASE_SERVICE_KEY in .env)
  use_supabase: true
